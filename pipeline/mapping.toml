# Mapping of raw Cargo values to what the tracker shows.
# Read by build_tracker_data.py (step 2). Edit freely and re-run the script.
#
# How matching works
#   Every raw value is turned into a key "<field>:<value>", e.g.
#     type:furniture      listcat:yoyos      tag:vendor:steampunker    hardmode:1
#   Values are normalised first: lowercased, whitespace collapsed, and a wiki
#   sort key after "|" is cut off ("souls|flight" -> "souls").
#   "*" in a match entry is a wildcard ("tag:vendor:*").
#   The fields that are read are listed in [settings] below.
#   Additionally "equip:<field>" keys: the player values an equippable item
#   changes (wiki Equipinfo table, e.g. equip:movespeed, equip:accrunspeed),
#   and "page:<wiki page>" (e.g. page:chairs - many items share a page),
#   "npc:critter" (the item is a catchable critter, NPCs table) and
#   "drop:npc" / "drop:boss" (dropped by an enemy / a boss, Drops table).
#
# Sections
#   categories, subcategories, obtain, vendors, events, biomes, times
#       One entry per id. Each becomes a list field on every item
#       (item.categories, item.subcategories, ...) and its own <section>.json
#       with a count of matching items. Order here = order in the output.
#         name       display name
#         match      raw keys that put an item into this entry
#         icon       name of an item whose icon is used, or
#         icon_file  a wiki file name (e.g. an NPC sprite)
#         (no icon)  -> icon of the first item in the entry
#         parent     (subcategories only) category id; items in the
#                    subcategory are also added to that category
#         fallback   (subcategories only) true = gets every item of the
#                    parent category that is in no other of its subcategories
#         only_in_parent  (subcategories only) true = only for items that are
#                    in the parent category anyway (does not add the parent)
#         exclude    keys that remove the entry again (e.g. ["tag:enemy banner"])
#         with_categories  (subcategories only) the parent's items that are also
#                    in one of these categories (e.g. ["block", "wall"])
#         without_categories  (subcategories only) not for items that are also in
#                    one of these categories
#       events, biomes and times also have rules for drops and spawn
#       conditions (environments, drop_conditions, alone; see their sections).
#   flags
#       Boolean item fields: true if any key matches.
#   drops, boss_stages, bosses
#       Which drop sources are used, and the curated boss list (see below).
#   recipes, recipe_groups, stations
#       Crafting: conditions that need no item, extra "Any ..." groups, and
#       which items provide a crafting station (recipes.json).
#   bestiary
#       Entry types and how the bestiary's filters map to biomes, times and
#       events (bestiary.json).
#   versions
#       Display names and icons (item names) of the game updates
#       (versions.json). Items are grouped by the Desktop patch that introduced
#       them: 1.0-1.3 by minor version, 1.4.x per update.
#   ignore
#       Raw keys that are dropped on purpose. Keys that are neither matched
#       nor ignored are reported as "unmapped" when the script runs.
#   manual
#       Assignments by item name, for items the wiki gives no `type`.
#       "<item name or pattern>" = ["<section>:<id>", ...]
#       Names are case-insensitive, "*" is a wildcard. Items that still end up
#       without a category are listed when the script runs.

[settings]
match_fields = ["type", "listcat", "tag", "hardmode", "unobtainable", "bodyslot"]


# ---------------------------------------------------------------- categories
# From the Items `type` field.

