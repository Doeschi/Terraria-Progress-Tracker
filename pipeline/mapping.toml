# -------------------------------------------------------------------- obtain
# How an item can be obtained. Built from `tag` and `listcat`; both are
# filled in by wiki editors and are not complete. Names read as "how", not
# "what" ("Crafted", not "Crafting"), so they are not mistaken for categories.
# loot = chests, pots, trees ...; plunder = placed in the world and collected
# (dungeon furniture, statues, ores).
# Our own data adds to the tags (derive_obtain in items.py):
#   from_drops       drop source kinds that give this method ("npc", "bag")
#   from_containers  container groups ([containers]) that give it
#   from_shimmer     results of shimmer transmutations
#   from_extractinator  results of these machines (extractinator.json; REQUIREMENTS B6)
#   names            item name patterns
#   fallback         items that got no method at all (kept last in the filter)

[obtain.crafted]
name = "Crafted"
icon = "Work Bench"
match = ["listcat:craftable items"]

[obtain.vendor]
name = "Bought from NPCs"
icon = "Gold Coin"
match = ["tag:vendor", "tag:buy", "tag:buyable", "tag:vendor:*"]

[obtain.drop]
name = "Dropped by enemies"
icon = "Gel"
match = ["tag:drop", "listcat:drop items"]
from_drops = ["npc"]

[obtain.loot]
name = "Found in chests & pots"
icon = "Chest"
match = ["tag:loot", "listcat:loot items"]
from_containers = ["chest"]

[obtain.plunder]
name = "Collected in the world"
icon = "Gold Chest"
match = ["tag:plunder", "tag:plunder:*", "listcat:plunder items"]
from_containers = ["tree"]

[obtain.bag]
name = "From grab bags & crates"
icon = "Wooden Crate"
match = ["tag:bag loot", "listcat:bag loot items"]
from_containers = ["crate", "other"]

[obtain.treasure-bag]
name = "From boss treasure bags"
icon_file = "Treasure Bag (Eye of Cthulhu).png"
match = ["tag:treasure bag loot", "listcat:treasure bag loot items"]
from_drops = ["bag"]

[obtain.fishing]
name = "Fished"
icon = "Wood Fishing Pole"
match = ["tag:fished", "listcat:fished items", "tag:quest fish"]

[obtain.quest-reward]
name = "Angler quest reward"
icon_file = "Angler.png"
match = ["tag:quest rewards", "listcat:quest rewards"]

# The wiki tags the Dye Trader's rewards for Strange Plants as "quest rewards" too.
# They are listed in the section `section` of `page` ({{item|...}}), grouped under
# headings like "After defeating [[Plantera]]" (conditions of the reward); for them
