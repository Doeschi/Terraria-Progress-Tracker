# ---------------------------------------------------------------- milestones
# "Available after": milestones of a typical playthrough, in this order (see
# REQUIREMENTS.md, MS). An item gets the earliest milestone of its sources:
#   bosses   boss ids ([bosses]) whose drops / treasure bags count for it
#   events   events whose enemies count for it (e.g. Pumpkin Moon -> Plantera)
# Vendors: [vendors.*] milestone = when they move in (default: start).
# Icon: `icon` (item) / `icon_file`, else the map icon of the first boss.

[milestones.start]
name = "World creation"
icon = "Copper Shortsword"

[milestones.king-slime]
name = "King Slime"
bosses = ["king-slime"]

[milestones.eye-of-cthulhu]
name = "Eye of Cthulhu"
bosses = ["eye-of-cthulhu"]

[milestones.evil-boss]
name = "Eater of Worlds / Brain of Cthulhu"
bosses = ["eater-of-worlds", "brain-of-cthulhu", "dark-mage"]
events = ["old-ones-army"]

[milestones.queen-bee]
name = "Queen Bee"
bosses = ["queen-bee"]

[milestones.deerclops]
name = "Deerclops"
bosses = ["deerclops"]

[milestones.skeletron]
name = "Skeletron"
bosses = ["skeletron"]

[milestones.wall-of-flesh]
name = "Wall of Flesh (Hardmode)"
bosses = ["wall-of-flesh", "flying-dutchman"]
events = ["pirate-invasion", "frost-legion"]

[milestones.queen-slime]
name = "Queen Slime"
bosses = ["queen-slime"]

[milestones.any-mech]
name = "Any mechanical boss"
bosses = ["the-twins", "the-destroyer", "skeletron-prime", "ogre"]
events = ["solar-eclipse"]

[milestones.all-mechs]
name = "All three mechanical bosses"
icon = "Mechanical Skull"

[milestones.plantera]
name = "Plantera"
bosses = ["plantera", "mourning-wood", "pumpking", "everscream", "santa-nk1", "ice-queen"]
events = ["pumpkin-moon", "frost-moon"]

[milestones.golem]
name = "Golem"
bosses = ["golem", "betsy", "martian-saucer"]
events = ["martian-madness"]

[milestones.duke-empress]
name = "Duke Fishron / Empress of Light"
bosses = ["duke-fishron", "empress-of-light"]

[milestones.lunatic-cultist]
name = "Lunatic Cultist"
bosses = ["lunatic-cultist", "solar-pillar", "nebula-pillar", "vortex-pillar", "stardust-pillar"]
events = ["lunar-events"]

[milestones.moon-lord]
name = "Moon Lord"
bosses = ["moon-lord"]

# Conditions ([conditions]) that are milestones; "after-<boss>" come from the bosses above.
[milestone_conditions]
hardmode = "wall-of-flesh"
after-any-mech = "any-mech"
after-all-mechs = "all-mechs"

# Containers (drop source names) that are only reachable later; others: start.
[container_milestones]
"Shadow Chest" = "skeletron"            # Shadow Key from the Dungeon
"Gold Chest (Dungeon)" = "skeletron"
"Golden Lock Box" = "skeletron"         # Golden Key from Dungeon enemies
"Obsidian Lock Box" = "skeletron"       # Shadow Key
"Dungeon Crate" = "skeletron"
"Lihzahrd Chest" = "plantera"
# Dungeon biome chests (keys from Hardmode biome enemies, locked until Plantera)
"Corruption Chest" = "plantera"
"Crimson Chest" = "plantera"
"Hallowed Chest" = "plantera"
"Ice Chest" = "plantera"
"Jungle Chest" = "plantera"
"Desert Chest" = "plantera"
# Hardmode crates
"Azure Crate" = "wall-of-flesh"
"Bramble Crate" = "wall-of-flesh"
"Boreal Crate" = "wall-of-flesh"
"Defiled Crate" = "wall-of-flesh"
"Hematic Crate" = "wall-of-flesh"
"Divine Crate" = "wall-of-flesh"
"Mirage Crate" = "wall-of-flesh"
"Seaside Crate" = "wall-of-flesh"
"Stockade Crate" = "wall-of-flesh"
"Hellstone Crate" = "wall-of-flesh"
"Mythril Crate" = "wall-of-flesh"
"Titanium Crate" = "wall-of-flesh"
"Pearlwood Crate" = "wall-of-flesh"

# Drop rows of an enemy's variants: the wiki names the variant in a note ("Mimic (Pre-Hardmode
# variant)"); rows without a note get the name given here (source name = name of the variant).
[drop_variants]
"Mimic" = "Hardmode variant"
"Ice Mimic" = "Hardmode variant"

# Containers with other items per layer (Gold Chest, Frozen Chest): the Drops table has one row per
# item with the chance per layer in notes ("1/6 (Underground) · 2/15 (Cavern) · 19/150 ("lava
# layer")"). Rows with these notes are split into one drop per layer (shown as variants; the
# drop groups under a page heading of that name belong to it). Note -> layer, in display order.
[drop_areas]
"Underground" = "Underground"
"Cavern" = "Cavern"
"lava layer" = "Cavern (lava layer)"
"within bottom 250 tiles of world" = "Cavern"

# Enemies that appear later than their biome says (drop source names). Enemies in the wiki's
# category "Hardmode-only NPCs" (raw/page_categories.json, by name or wiki page) count from the
# Wall of Flesh; entries here override that, in both directions.
[milestone_sources]
# pre-Hardmode enemies on a shared page of the category ("Jellyfish", "Mimics")
"Blue Jellyfish" = "start"
"Pink Jellyfish" = "start"
"Mimic" = "start"
"Ice Mimic" = "start"
# Hardmode-only, but missing from the category
"Orca" = "wall-of-flesh"
# spawns only near a fallen meteor: one lands only after the Eater of Worlds / Brain of Cthulhu
"Meteor Head" = "evil-boss"
# Old One's Army tier 2 (after any mechanical boss)
"Kobold" = "any-mech"
"Kobold Glider" = "any-mech"
"Drakin" = "any-mech"
"Wither Beast" = "any-mech"
"Etherian Lightning Bug" = "any-mech"
"Ogre" = "any-mech"
# post-Plantera Dungeon
"Paladin" = "plantera"
"Skeleton Sniper" = "plantera"
"Tactical Skeleton" = "plantera"
"Skeleton Commando" = "plantera"
"Ragged Caster" = "plantera"
"Necromancer" = "plantera"
"Diabolist" = "plantera"
"Blue Armored Bones" = "plantera"
"Rusty Armored Bones" = "plantera"
"Hell Armored Bones" = "plantera"
"Bone Lee" = "plantera"
"Dungeon Spirit" = "plantera"
"Giant Cursed Skull" = "plantera"

# Minimum milestone of items the data cannot tell (name patterns, "*" at the end = prefix).
[milestone_items]
"Hellstone" = { milestone = "evil-boss", reason = "mined (needs a Nightmare Pickaxe / Deathbringer Pickaxe)" }
"Chlorophyte Ore" = { milestone = "all-mechs", reason = "mined (needs a Pickaxe Axe / Drax)" }
"Meteorite" = { milestone = "evil-boss", reason = "a meteor lands only after the Eater of Worlds / Brain of Cthulhu" }
"Lihzahrd Brick" = { milestone = "golem", reason = "mined (needs the Picksaw)" }
"Life Fruit" = { milestone = "any-mech", reason = "grows after any mechanical boss" }
# crafted from Chlorophyte Bars (the wiki tags it "plunder", which would make it a plain Hardmode item)
"Chlorophyte Extractinator" = { milestone = "all-mechs", reason = "crafted – needs Chlorophyte Bars" }


# --------------------------------------------------------------------- flags

[flags]
hardmode = ["hardmode:1", "tag:hardmode", "tag:hardmodeonly"]
hardmodeOnly = ["tag:hardmodeonly"]
unobtainable = ["unobtainable:1", "tag:unobtainable", "listcat:unobtainable items"]
banner = ["tag:enemy banner"]
questFish = ["tag:quest fish"]


# --------------------------------------------------------------------- drops
# What the wiki's Drops table contributes (drops.json). Source kinds:
#   npc        enemies and bosses (the table's "isfromnpc")
#   bag        boss treasure bags ("Treasure Bag (...)")
#   container  chests, crates, lock boxes, grab bags, shaking trees (grouped by [containers])

[drops]
include_kinds = ["npc", "bag", "container"]
# Generic drops almost every boss has. They do not count for the
# "Dropped by boss" filter (they still show in the item's drop list).
boss_ignore_items = [
    "Copper Coin", "Silver Coin", "Gold Coin", "Platinum Coin",
    "Lesser Healing Potion", "Healing Potion", "Greater Healing Potion", "Super Healing Potion",
]


# ------------------------------------------------------------------- pickups
# Picked up and used up on touch, never in the inventory (healing hearts, mana stars and
# their seasonal variants, Nebula boosters): left out of the items entirely.

[pickups]
items = ["Heart", "Candy Apple", "Candy Cane", "Star", "Soul Cake", "Sugar Plum",
         "Damage Booster", "Life Booster", "Mana Booster"]


# -------------------------------------------------------------- unobtainable
# Items the wiki marks unobtainable (field, tag or category) only belong to the obtain
# method "Unobtainable". Overrides of the wiki: names in `obtainable` count as obtainable,
# names in `unobtainable` as unobtainable (items that were never really added to the game).

[unobtainable]
obtainable = []
unobtainable = ["Red Envelope", "Mythical Lion Mask", "Mythical Robe"]


# ------------------------------------------------------------------- recipes
# Crafting recipes (recipes.json) from the wiki's Recipes table.
#   conditions  station names that need no item: environment conditions and
#               world objects (a recipe can need several stations, e.g.
#               "Work Bench and Ecto Mist")
#   shimmer     the station name of shimmer transmutations (kept apart)
# The "Any ..." ingredient groups come from the wiki page "Alternative crafting
# ingredients" (raw/page_wikitext.json); [recipe_groups] adds groups the page
# does not list (item name patterns, "*" = wildcard).

[recipes]
conditions = ["By Hand", "Water", "Honey", "Lava", "Snow Biome", "Ecto Mist", "Demon Altar"]
shimmer = "Shimmer"

[recipe_groups]
"Any Torch" = ["torch", "* torch"]
"Recorded Music Boxes" = ["music box (*)"]

# Groups of container sources (filter "Found in"), in this order. Sources are
# matched by name ("*" = wildcard); the first group that matches wins, a
# `fallback` group takes the rest. `icon` = item whose icon the group shows.
[containers.chest]
name = "Chests"
icon = "Gold Chest"
match = ["chest", "* chest", "* chest (*)"]

[containers.crate]
name = "Crates"
icon = "Wooden Crate"
match = ["* crate"]

[containers.other]
name = "Other containers"
icon = "Golden Lock Box"
fallback = true

[containers.tree]
name = "Trees"
icon = "Acorn"
match = ["shaking *"]

# Icons of container sources that are no item themselves (source name -> item).
# Sources like "Gold Chest (Dungeon)" use the item without the suffix.
[container_icons]
"Shaking Forest tree" = "Wood"
"Shaking Palm tree" = "Palm Wood"
"Shaking Boreal tree" = "Boreal Wood"
"Shaking Mahogany tree" = "Rich Mahogany"
"Shaking Ash tree" = "Ash Wood"
"Shaking Ebonwood tree" = "Ebonwood"
"Shaking Ebonwood Palm tree" = "Ebonwood"
"Shaking Shadewood tree" = "Shadewood"
"Shaking Shadewood Palm tree" = "Shadewood"
"Shaking Pearlwood tree" = "Pearlwood"
"Shaking Pearlwood Palm tree" = "Pearlwood"
"Shaking Giant Glowing Mushroom" = "Glowing Mushroom"


# Items the wiki's Items table lacks but its Recipes table names with an id
# (mostly 1.4.5 doors and candelabras). They are added to items.json with name,
# id and icon from the recipe and, from a similar item (template), the page,
# categories, platforms and placement flags (obtained: crafted) - no stats, rarity or
# prices (marked "recipeOnly"). Name pattern ("*" = wildcard) -> template item.
# Items that match nothing are reported and stay in missing_items.json.
[recipe_items]
"* Door" = "Ash Wood Door"
"* Candelabra" = "Ash Wood Candelabra"
"Magic Shimmer Dropper" = "Magic Water Dropper"
"Trusty Chillet*" = "Chillet"


# Station -> the items that provide it (name patterns, "*" = wildcard), stronger
# stations included. Stations not listed here are provided by the item of the
# same name.
[stations]
"Work Bench" = ["work bench", "* work bench"]
"Iron Anvil" = ["iron anvil", "lead anvil", "mythril anvil", "orichalcum anvil"]
"Mythril Anvil" = ["mythril anvil", "orichalcum anvil"]
"Furnace" = ["furnace", "hellforge", "adamantite forge", "titanium forge"]
"Hellforge" = ["hellforge", "adamantite forge", "titanium forge"]
"Adamantite Forge" = ["adamantite forge", "titanium forge"]
"Loom" = ["loom", "living loom"]
"Cooking Pot" = ["cooking pot", "cauldron"]
"Placed Bottle" = ["bottle", "alchemy table"]
"Bookcase" = ["bookcase", "* bookcase"]
"Campfire" = ["campfire", "* campfire"]


# ------------------------------------------------------------------ bestiary
