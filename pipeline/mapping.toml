# ---------------------------------------------------------------- conditions
# When a shop row (vendor pages, `{{shop row|item|condition}}`) or a drop is
# available. Condition texts are split into clauses; the wiki links of a clause
# (and `phrases`, regular expressions on its plain text) give the ids below or
# those of [events.*] / [biomes.*] (their `links` / `phrases`). Links after a
# negation ("before", "except", "not", ...) in the same clause are skipped.
# "After <boss>" conditions come from [bosses] (the boss's name and drop sources,
# in a clause with "defeated"). `group` = one of [conditions.groups]; groups with
# `filter = true` make up the "Conditions" filter, the others are only shown.
# Moon phases come from {{moons|n}} (the wiki's moon icons "Moon-n.png").
# Unmapped links are reported unless they name an item or are in ignore_links.

[conditions]
ignore_links = [
    "moon phase", "pylons", "golf score", "health", "mana", "multiplayer", "vampirism",
    "world is infected", "npc drops", "coins", "altar", "clown", "tax collector",
    "expert mode", "master mode", "portable storage", "fairies",
    # "if the Party Girl is present"
    "party girl", "mechanic", "wizard", "angler", "pirate",
]

[conditions.groups]
time = { name = "Time of day", filter = true }
moon = { name = "Moon phase", filter = true }
boss = { name = "After a boss", filter = true }
weather = { name = "Weather", filter = true }
progress = { name = "Progress", filter = false }
seed = { name = "World seed", filter = false }
special = { name = "Special", filter = false, column = true }

[conditions.day]
name = "Day"
group = "time"
icon = "Sunflower"
links = ["day", "daytime"]

[conditions.night]
