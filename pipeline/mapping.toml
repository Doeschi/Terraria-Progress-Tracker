# -------------------------------------------------------------------- ignore
# Dropped on purpose (duplicates of other fields, or not useful).

[ignore]
keys = [
    "type:set",                      # armor/vanity set pages, not items
    "tag:mechanism", "tag:storage", "tag:light source", "tag:wiring",
    "tag:construction", "tag:fishing",
    "tag:vendor:seed:*",             # special-seed vendor variants
    "tag:during:night",              # not an event (1 item)
    "tag:after:event:*",             # sold after an event (2 items)
    "listcat:accessory items", "listcat:ammunition items",
    "listcat:weapon items", "listcat:storage items",
    "listcat:mechanism items", "listcat:light source items",
    "listcat:crafting stations", "listcat:minecart track items",
    "listcat:souls", "listcat:scope", "listcat:buffs", "listcat:debuffs",
    "listcat:wall-piercing weapons",
]


