# Special cases: shown in the "Conditions" column (column = true), not filterable.
# Bestiary progress, golf score and NPC names are recognised in conditions.py and
# get their number / name ("Bestiary ≥ 30 %", "Golf score over 500", "NPC named Jim").
[conditions.no-altar]
name = "No altar placed in the world"
group = "special"
phrases = ['\bno altar\b']

# Worlds without one of these structures: the drops that replace it (Dungeon bricks from the Eater of
