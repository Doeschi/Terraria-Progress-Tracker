include = []
exclude = []

# Minimums of the parts read from page text (REQUIREMENTS DU2): below one, step 2 stops before
# writing the data (a changed wiki template, not a smaller game). About 90 % of the counts of the
# last download; raise them when the game grows (build_warnings.json has the current counts).
[sanity]
shop_rows = 700               # rows of the vendor pages' shops (817)
bestiary_entries = 500        # Bestiary/List (546)
npc_ids = 500                 # bestiary entries with an NPC id from "NPC IDs" (546)
ingredient_groups = 30        # "Any ..." groups of "Alternative crafting ingredients" (34)
platform_icons = 6            # icons in MediaWiki:Common.css (6)
drop_group_pages = 80         # pages with drop groups (93)
strange_plant_rewards = 30    # the Dye Trader's rewards (33)
extractinator_results = 50    # per machine (56 / 142)

# Renamed items the update report cannot detect (their item id changed too): old key = new key.
